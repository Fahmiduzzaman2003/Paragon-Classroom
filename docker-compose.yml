services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paragon
      POSTGRES_PASSWORD: paragon
      POSTGRES_DB: paragon
    volumes:
      - paragon-pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paragon"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://paragon:paragon@postgres:5432/paragon
      UPLOADS_DIR: /app/uploads
      CHROMA_PATH: /app/chroma_data
      APP_FRONTEND_ORIGIN: "http://localhost:5173,http://localhost:8081"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-in-prod}
    ports:
      - "8000:8000"
    volumes:
      - paragon-uploads:/app/uploads
      - paragon-chroma:/app/chroma_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  paragon-pg:
  paragon-uploads:
  paragon-chroma:
