server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback so React Router routes resolve
  location / {
    try_files $uri /index.html;
  }

  # Long-cache built JS/CSS (filenames are hashed)
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Don't cache the entry HTML
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
