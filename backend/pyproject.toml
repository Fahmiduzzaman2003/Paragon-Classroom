[project]
name = "paragon-backend"
version = "0.1.0"
description = "Paragon — RAG-powered classrooms backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.35",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.5",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-multipart>=0.0.12",
  "bcrypt==4.0.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "chromadb>=0.5.15",
  "rank-bm25>=0.2.2",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "markdown-it-py>=3.0",
  "tiktoken>=0.8",
  "openai>=1.50",
  "anthropic>=0.40",
  "google-generativeai>=0.8",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "black>=24.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
