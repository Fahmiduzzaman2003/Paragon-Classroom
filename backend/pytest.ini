[pytest]
# ─────────────────────────────────────────────────────
# Paragon test runner
#
# Layers:
#   tests/unit/         → in-process, no DB, no HTTP
#   tests/integration/  → FastAPI app + isolated SQLite + httpx ASGI
#   tests/system/       → full stack: live backend on :8000 (started by
#                         conftest if not already running) and live frontend
#                         pages asserted through HTTP semantics. Suitable for
#                         CI / local pre-deploy.
#
# Run all:    pytest -q
# Run unit:   pytest -q tests/unit
# Run int:    pytest -q tests/integration
# Run sys:    pytest -q tests/system
# Coverage:   pytest --cov=app --cov-report=term-missing
# ─────────────────────────────────────────────────────

minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: pure unit tests, no external services
    integration: tests that spin up the FastAPI app with a temp DB
    system: end-to-end tests that talk to a running backend
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = -ra --strict-markers --tb=short

log_cli = false
log_cli_level = INFO
